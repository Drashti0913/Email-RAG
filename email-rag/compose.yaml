services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: email_rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./schema.sql:/opt/rag/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d email_rag"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  pgdata:
